services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  property-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: property_db
      POSTGRES_USER: hotelsync
      POSTGRES_PASSWORD: hotelsync_dev
    ports:
      - "5432:5432"
    volumes:
      - property_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelsync -d property_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rate-availability-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rate_availability_db
      POSTGRES_USER: hotelsync
      POSTGRES_PASSWORD: hotelsync_dev
    ports:
      - "5433:5432"
    volumes:
      - rate_availability_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelsync -d rate_availability_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  booking-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: hotelsync
      POSTGRES_PASSWORD: hotelsync_dev
    ports:
      - "5434:5432"
    volumes:
      - booking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelsync -d booking_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  channel-manager-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: channel_manager_db
      POSTGRES_USER: hotelsync
      POSTGRES_PASSWORD: hotelsync_dev
    ports:
      - "5439:5432"
    volumes:
      - channel_manager_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelsync -d channel_manager_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  front-desk-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: front_desk_db
      POSTGRES_USER: hotelsync
      POSTGRES_PASSWORD: hotelsync_dev
    ports:
      - "5435:5432"
    volumes:
      - front_desk_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelsync -d front_desk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  loyalty-db:
    image: postgres:16-alpine
    ports:
      - "5440:5432"
    environment:
      POSTGRES_USER: hotelsync
      POSTGRES_PASSWORD: loyalty_dev
      POSTGRES_DB: loyalty_db
    volumes:
      - loyalty_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelsync -d loyalty_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: payment_db
      POSTGRES_USER: hotelsync
      POSTGRES_PASSWORD: payment_dev
    ports:
      - "5441:5432"
    volumes:
      - payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelsync -d payment_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  analytics-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: analytics_db
      POSTGRES_USER: hotelsync
      POSTGRES_PASSWORD: analytics_dev
    ports:
      - "5442:5432"
    volumes:
      - analytics_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelsync -d analytics_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    ports:
      # 8082: el 8080 queda para el api-gateway.
      - "8082:8080"
    depends_on:
      property-db:
        condition: service_healthy
      rate-availability-db:
        condition: service_healthy
      booking-db:
        condition: service_healthy
      front-desk-db:
        condition: service_healthy
      housekeeping-db:
        condition: service_healthy
      billing-db:
        condition: service_healthy
      user-db:
        condition: service_healthy
      analytics-db:
        condition: service_healthy
    restart: unless-stopped

  property-service:
    build:
      context: .
      dockerfile: services/property-service/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://hotelsync:hotelsync_dev@property-db:5432/property_db
      RABBITMQ_URL: amqp://rabbitmq:5672
      # Solo desarrollo: en produccion inyectar un secreto propio de 32+ chars.
      AUTH_JWT_SECRET: hotelsync-dev-secret-change-me-min-32-chars-ok
    depends_on:
      property-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  rate-availability-service:
    build:
      context: .
      dockerfile: services/rate-availability-service/Dockerfile
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: "3002"
      DATABASE_URL: postgresql://hotelsync:hotelsync_dev@rate-availability-db:5432/rate_availability_db
      # Solo desarrollo: en produccion inyectar un secreto propio de 32+ chars.
      AUTH_JWT_SECRET: hotelsync-dev-secret-change-me-min-32-chars-ok
      # Clave servicio-a-servicio (Booking -> R&A). Solo desarrollo.
      SERVICE_API_KEY: hotelsync-dev-service-key-change-me
      # Resolución room_type -> hotel para el scope de MANAGER (R&A -> Property).
      PROPERTY_SERVICE_URL: http://property-service:3001/v1
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      rate-availability-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: production
      PORT: "3004"
      DATABASE_URL: postgresql://hotelsync:hotelsync_dev@booking-db:5432/booking_db
      # Solo desarrollo: en produccion inyectar un secreto propio de 32+ chars.
      AUTH_JWT_SECRET: hotelsync-dev-secret-change-me-min-32-chars-ok
      RATE_SERVICE_URL: http://rate-availability-service:3002/v1
      # Debe coincidir con SERVICE_API_KEY de rate-availability-service.
      SERVICE_API_KEY: hotelsync-dev-service-key-change-me
      # Clave exclusiva para las consultas internas de Front Desk.
      FRONT_DESK_SERVICE_KEY: hotelsync-dev-front-desk-key-change-me
      HOUSEKEEPING_SERVICE_KEY: hotelsync-dev-housekeeping-key-change-me
      BILLING_SERVICE_KEY: hotelsync-dev-billing-key-change-me
      # Clave exclusiva para la verificación de reservas activas (baja de cuentas).
      USER_SERVICE_KEY: hotelsync-dev-user-key-change-me
      # Ingesta Channel Manager (contrato interno §5.4). Solo desarrollo.
      CHANNEL_MANAGER_SERVICE_KEY: hotelsync-dev-channel-manager-key-change-me
      # Clave estable separada para derivar el manage_token idempotente de OTAs.
      CHANNEL_MANAGER_MANAGE_TOKEN_SECRET: hotelsync-dev-channel-manage-token-secret-change-me
      LOYALTY_SERVICE_KEY: hotelsync-dev-loyalty-key-change-me
      # payment-service lee reservas con x-payment-key. Solo desarrollo.
      PAYMENT_SERVICE_KEY: hotelsync-dev-payment-key-change-me
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      booking-db:
        condition: service_healthy
      rate-availability-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  front-desk-service:
    build:
      context: .
      dockerfile: services/front-desk-service/Dockerfile
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: production
      PORT: "3005"
      DATABASE_URL: postgresql://hotelsync:hotelsync_dev@front-desk-db:5432/front_desk_db
      # Solo desarrollo: en produccion inyectar un secreto propio de 32+ chars.
      AUTH_JWT_SECRET: hotelsync-dev-secret-change-me-min-32-chars-ok
      BOOKING_SERVICE_URL: http://booking-service:3004/v1
      BOOKING_SERVICE_KEY: hotelsync-dev-front-desk-key-change-me
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      front-desk-db:
        condition: service_healthy
      booking-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  housekeeping-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: housekeeping_db
      POSTGRES_USER: hotelsync
      POSTGRES_PASSWORD: hotelsync_dev
    ports:
      - "5436:5432"
    volumes:
      - housekeeping_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelsync -d housekeeping_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  billing-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: billing_db
      POSTGRES_USER: hotelsync
      POSTGRES_PASSWORD: hotelsync_dev
    ports:
      - "5437:5432"
    volumes:
      - billing_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelsync -d billing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: hotelsync
      POSTGRES_PASSWORD: hotelsync_dev
    ports:
      - "5438:5432"
    volumes:
      - user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelsync -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  housekeeping-service:
    build:
      context: .
      dockerfile: services/housekeeping-service/Dockerfile
    ports:
      - "3006:3006"
    environment:
      NODE_ENV: production
      PORT: "3006"
      DATABASE_URL: postgresql://hotelsync:hotelsync_dev@housekeeping-db:5432/housekeeping_db
      # Solo desarrollo: en produccion inyectar un secreto propio de 32+ chars.
      AUTH_JWT_SECRET: hotelsync-dev-secret-change-me-min-32-chars-ok
      USER_SERVICE_URL: http://user-service:3003/v1
      BOOKING_SERVICE_URL: http://booking-service:3004/v1
      BOOKING_SERVICE_KEY: hotelsync-dev-housekeeping-key-change-me
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      housekeeping-db:
        condition: service_healthy
      booking-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  billing-service:
    build:
      context: .
      dockerfile: services/billing-service/Dockerfile
    ports:
      - "3007:3007"
    environment:
      NODE_ENV: production
      PORT: "3007"
      DATABASE_URL: postgresql://hotelsync:hotelsync_dev@billing-db:5432/billing_db
      # Solo desarrollo: en produccion inyectar un secreto propio de 32+ chars.
      AUTH_JWT_SECRET: hotelsync-dev-secret-change-me-min-32-chars-ok
      BOOKING_SERVICE_URL: http://booking-service:3004/v1
      BOOKING_SERVICE_KEY: hotelsync-dev-billing-key-change-me
      PROPERTY_SERVICE_URL: http://property-service:3001/v1
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      billing-db:
        condition: service_healthy
      booking-service:
        condition: service_started
      property-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
      PORT: "3003"
      DATABASE_URL: postgresql://hotelsync:hotelsync_dev@user-db:5432/user_db
      # Solo desarrollo: en produccion inyectar un secreto propio de 32+ chars.
      AUTH_JWT_SECRET: hotelsync-dev-secret-change-me-min-32-chars-ok
      BOOTSTRAP_ADMIN_EMAIL: admin@hotelsync.local
      BOOTSTRAP_ADMIN_PASSWORD: Admin123!
      # Login social (valores reales solo por entorno, nunca en el repo).
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
      LOYALTY_SERVICE_KEY: hotelsync-dev-loyalty-key-change-me
      # Verificación de reservas activas en Booking (baja de cuentas).
      BOOKING_SERVICE_URL: http://booking-service:3004/v1
      BOOKING_SERVICE_KEY: hotelsync-dev-user-key-change-me
      # Solo desarrollo: expone el código de recuperación en la respuesta (demo).
      MAILER_PROVIDER: log
      PASSWORD_RESET_DEMO_CODE: "true"
    depends_on:
      user-db:
        condition: service_healthy
    restart: unless-stopped

  channel-manager-service:
    build:
      context: .
      dockerfile: services/channel-manager-service/Dockerfile
    ports:
      - "3008:3008"
    environment:
      NODE_ENV: production
      PORT: "3008"
      DATABASE_URL: postgresql://hotelsync:hotelsync_dev@channel-manager-db:5432/channel_manager_db
      BOOKING_SERVICE_URL: http://booking-service:3004/v1
      RATE_SERVICE_URL: http://rate-availability-service:3002/v1
      CHANNEL_MANAGER_SERVICE_KEY: hotelsync-dev-channel-manager-key-change-me
      # Provider-facing simulator key is distinct from all backend service keys.
      CHANNEL_MANAGER_SIMULATOR_KEY: hotelsync-dev-simulator-provider-key-change-me
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      channel-manager-db:
        condition: service_healthy
      booking-service:
        condition: service_started
      rate-availability-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  loyalty-service:
    build:
      context: .
      dockerfile: services/loyalty-service/Dockerfile
    ports:
      - "3009:3009"
    environment:
      NODE_ENV: production
      PORT: "3009"
      DATABASE_URL: postgresql://hotelsync:loyalty_dev@loyalty-db:5432/loyalty_db
      AUTH_JWT_SECRET: hotelsync-dev-secret-change-me-min-32-chars-ok
      BOOKING_SERVICE_URL: http://booking-service:3004/v1
      USER_SERVICE_URL: http://user-service:3003/v1
      # Clave propia para leer reservas y estado de cuentas (header x-loyalty-key).
      LOYALTY_SERVICE_KEY: hotelsync-dev-loyalty-key-change-me
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      loyalty-db:
        condition: service_healthy
      booking-service:
        condition: service_started
      user-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: services/payment-service/Dockerfile
    ports:
      - "3010:3010"
    environment:
      NODE_ENV: production
      PORT: "3010"
      DATABASE_URL: postgresql://hotelsync:payment_dev@payment-db:5432/payment_db
      # Debe ser idéntico al de user-service.
      AUTH_JWT_SECRET: hotelsync-dev-secret-change-me-min-32-chars-ok
      BOOKING_SERVICE_URL: http://booking-service:3004/v1
      # = PAYMENT_SERVICE_KEY de booking-service.
      BOOKING_SERVICE_KEY: hotelsync-dev-payment-key-change-me
      PAYMENT_CURRENCY: COP
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      payment-db:
        condition: service_healthy
      booking-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  analytics-service:
    build:
      context: .
      dockerfile: services/analytics-service/Dockerfile
    ports:
      - "3011:3011"
    environment:
      NODE_ENV: production
      PORT: "3011"
      DATABASE_URL: postgresql://hotelsync:analytics_dev@analytics-db:5432/analytics_db
      # Réplicas de SOLO LECTURA: analytics nunca escribe en bases de otros servicios.
      DATABASE_URL_BOOKING: postgresql://hotelsync:hotelsync_dev@booking-db:5432/booking_db
      DATABASE_URL_PROPERTY: postgresql://hotelsync:hotelsync_dev@property-db:5432/property_db
      # Debe ser idéntico al de user-service.
      AUTH_JWT_SECRET: hotelsync-dev-secret-change-me-min-32-chars-ok
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      analytics-db:
        condition: service_healthy
      booking-db:
        condition: service_healthy
      property-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  api-gateway:
    build:
      context: .
      dockerfile: services/api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      # Solo desarrollo: en produccion usar un secreto de 32+ chars, identico al del BFF.
      GATEWAY_SHARED_SECRET: hotelsync-dev-gateway-secret-change-me
      # Los servicios free de Render duermen; 10 s cortaba en frio.
      UPSTREAM_TIMEOUT_MS: "45000"
      # En local no hay cold start: el broadcast de despertar solo agrega ruido.
      WAKE_ALL_ENABLED: "false"
      PROPERTY_SERVICE_URL: http://property-service:3001/v1
      RATE_AVAILABILITY_SERVICE_URL: http://rate-availability-service:3002/v1
      USER_SERVICE_URL: http://user-service:3003/v1
      BOOKING_SERVICE_URL: http://booking-service:3004/v1
      FRONT_DESK_SERVICE_URL: http://front-desk-service:3005/v1
      HOUSEKEEPING_SERVICE_URL: http://housekeeping-service:3006/v1
      BILLING_SERVICE_URL: http://billing-service:3007/v1
      # Termina en /v1/simulator: /channel-manager/* mapea 1:1 con el simulador.
      CHANNEL_MANAGER_SERVICE_URL: http://channel-manager-service:3008/v1/simulator
      LOYALTY_SERVICE_URL: http://loyalty-service:3009/v1
      PAYMENTS_SERVICE_URL: http://payment-service:3010/v1
      ANALYTICS_SERVICE_URL: http://analytics-service:3011/v1
    depends_on:
      property-service:
        condition: service_started
      rate-availability-service:
        condition: service_started
      user-service:
        condition: service_started
      booking-service:
        condition: service_started
      front-desk-service:
        condition: service_started
      housekeeping-service:
        condition: service_started
      billing-service:
        condition: service_started
      channel-manager-service:
        condition: service_started
      loyalty-service:
        condition: service_started
      payment-service:
        condition: service_started
      analytics-service:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:8080/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

volumes:
  property_data:
  rate_availability_data:
  booking_data:
  front_desk_data:
  housekeeping_data:
  billing_data:
  user_data:
  channel_manager_data:
  rabbitmq_data:
  redis_data:
  loyalty_data:
  payment_data:
  analytics_data: