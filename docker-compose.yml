services:
  rabbitmq:
    image: rabbitmq:3.13-management
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  property-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: property_db
      POSTGRES_USER: hotelsync
      POSTGRES_PASSWORD: hotelsync_dev
    ports:
      - "5432:5432"
    volumes:
      - property_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelsync -d property_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  rate-availability-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rate_availability_db
      POSTGRES_USER: hotelsync
      POSTGRES_PASSWORD: hotelsync_dev
    ports:
      - "5433:5432"
    volumes:
      - rate_availability_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelsync -d rate_availability_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  booking-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: booking_db
      POSTGRES_USER: hotelsync
      POSTGRES_PASSWORD: hotelsync_dev
    ports:
      - "5434:5432"
    volumes:
      - booking_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelsync -d booking_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  front-desk-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: front_desk_db
      POSTGRES_USER: hotelsync
      POSTGRES_PASSWORD: hotelsync_dev
    ports:
      - "5435:5432"
    volumes:
      - front_desk_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelsync -d front_desk_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4
    ports:
      - "8080:8080"
    depends_on:
      property-db:
        condition: service_healthy
      rate-availability-db:
        condition: service_healthy
      booking-db:
        condition: service_healthy
      front-desk-db:
        condition: service_healthy
      housekeeping-db:
        condition: service_healthy
      billing-db:
        condition: service_healthy
      user-db:
        condition: service_healthy
    restart: unless-stopped

  property-service:
    build:
      context: .
      dockerfile: services/property-service/Dockerfile
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://hotelsync:hotelsync_dev@property-db:5432/property_db
      RABBITMQ_URL: amqp://rabbitmq:5672
      # Solo desarrollo: en produccion inyectar un secreto propio de 32+ chars.
      AUTH_JWT_SECRET: hotelsync-dev-secret-change-me-min-32-chars-ok
    depends_on:
      property-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  rate-availability-service:
    build:
      context: .
      dockerfile: services/rate-availability-service/Dockerfile
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: "3002"
      DATABASE_URL: postgresql://hotelsync:hotelsync_dev@rate-availability-db:5432/rate_availability_db
      # Solo desarrollo: en produccion inyectar un secreto propio de 32+ chars.
      AUTH_JWT_SECRET: hotelsync-dev-secret-change-me-min-32-chars-ok
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      rate-availability-db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  booking-service:
    build:
      context: .
      dockerfile: services/booking-service/Dockerfile
    ports:
      - "3004:3004"
    environment:
      NODE_ENV: production
      PORT: "3004"
      DATABASE_URL: postgresql://hotelsync:hotelsync_dev@booking-db:5432/booking_db
      # Solo desarrollo: en produccion inyectar un secreto propio de 32+ chars.
      AUTH_JWT_SECRET: hotelsync-dev-secret-change-me-min-32-chars-ok
      RATE_SERVICE_URL: http://rate-availability-service:3002/v1
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      booking-db:
        condition: service_healthy
      rate-availability-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  front-desk-service:
    build:
      context: .
      dockerfile: services/front-desk-service/Dockerfile
    ports:
      - "3005:3005"
    environment:
      NODE_ENV: production
      PORT: "3005"
      DATABASE_URL: postgresql://hotelsync:hotelsync_dev@front-desk-db:5432/front_desk_db
      # Solo desarrollo: en produccion inyectar un secreto propio de 32+ chars.
      AUTH_JWT_SECRET: hotelsync-dev-secret-change-me-min-32-chars-ok
      BOOKING_SERVICE_URL: http://booking-service:3004/v1
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      front-desk-db:
        condition: service_healthy
      booking-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  housekeeping-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: housekeeping_db
      POSTGRES_USER: hotelsync
      POSTGRES_PASSWORD: hotelsync_dev
    ports:
      - "5436:5432"
    volumes:
      - housekeeping_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelsync -d housekeeping_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  billing-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: billing_db
      POSTGRES_USER: hotelsync
      POSTGRES_PASSWORD: hotelsync_dev
    ports:
      - "5437:5432"
    volumes:
      - billing_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelsync -d billing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: hotelsync
      POSTGRES_PASSWORD: hotelsync_dev
    ports:
      - "5438:5432"
    volumes:
      - user_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hotelsync -d user_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  housekeeping-service:
    build:
      context: .
      dockerfile: services/housekeeping-service/Dockerfile
    ports:
      - "3006:3006"
    environment:
      NODE_ENV: production
      PORT: "3006"
      DATABASE_URL: postgresql://hotelsync:hotelsync_dev@housekeeping-db:5432/housekeeping_db
      # Solo desarrollo: en produccion inyectar un secreto propio de 32+ chars.
      AUTH_JWT_SECRET: hotelsync-dev-secret-change-me-min-32-chars-ok
      USER_SERVICE_URL: http://user-service:3003/v1
      BOOKING_SERVICE_URL: http://booking-service:3004/v1
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      housekeeping-db:
        condition: service_healthy
      booking-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  billing-service:
    build:
      context: .
      dockerfile: services/billing-service/Dockerfile
    ports:
      - "3007:3007"
    environment:
      NODE_ENV: production
      PORT: "3007"
      DATABASE_URL: postgresql://hotelsync:hotelsync_dev@billing-db:5432/billing_db
      # Solo desarrollo: en produccion inyectar un secreto propio de 32+ chars.
      AUTH_JWT_SECRET: hotelsync-dev-secret-change-me-min-32-chars-ok
      BOOKING_SERVICE_URL: http://booking-service:3004/v1
      PROPERTY_SERVICE_URL: http://property-service:3001/v1
      RABBITMQ_URL: amqp://rabbitmq:5672
    depends_on:
      billing-db:
        condition: service_healthy
      booking-service:
        condition: service_started
      property-service:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  user-service:
    build:
      context: .
      dockerfile: services/user-service/Dockerfile
    ports:
      - "3003:3003"
    environment:
      NODE_ENV: production
      PORT: "3003"
      DATABASE_URL: postgresql://hotelsync:hotelsync_dev@user-db:5432/user_db
      # Solo desarrollo: en produccion inyectar un secreto propio de 32+ chars.
      AUTH_JWT_SECRET: hotelsync-dev-secret-change-me-min-32-chars-ok
      BOOTSTRAP_ADMIN_EMAIL: admin@hotelsync.local
      BOOTSTRAP_ADMIN_PASSWORD: Admin123!
      # Login social (valores reales solo por entorno, nunca en el repo).
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:-}
    depends_on:
      user-db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  property_data:
  rate_availability_data:
  booking_data:
  front_desk_data:
  housekeeping_data:
  billing_data:
  user_data:
  rabbitmq_data:
  redis_data:
